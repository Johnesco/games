<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — John Escobedo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
  }

  header {
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #f0f6fc;
    letter-spacing: -0.02em;
  }
  header p {
    color: #8b949e;
    margin-top: 0.4rem;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  header a {
    color: #8b949e;
    text-decoration: none;
    border-bottom: 1px dotted #8b949e;
  }
  header a:hover { color: #c9d1d9; border-bottom-color: #c9d1d9; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 1.25rem 1.4rem;
    transition: border-color 0.2s, transform 0.15s;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    min-height: 5.5rem;
  }
  .card:hover {
    border-color: #388bfd;
    transform: translateY(-2px);
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #f0f6fc;
    margin-bottom: 0.35rem;
  }

  .card-desc {
    color: #8b949e;
    font-size: 0.85rem;
    line-height: 1.5;
    flex: 1;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Games</h1>
    <p>Small browser games and interactive experiments. <a href="https://johnesco.github.io/">← back to portfolio</a></p>
  </header>

  <div class="grid" id="grid"></div>

</div>

<script>
  // Index is structural only: it knows which folders are games.
  // All info (title, description) lives inside each game's own index.html.
  const GAMES = [
    { slug: 'blackout' },
    { slug: 'carrace' },
    { slug: 'farm' },
    { slug: 'farmink' },
    { slug: 'gridland', href: 'gridland/www/' },
    { slug: 'offroad' },
    { slug: 'resumegame' },
    { slug: 'snake' },
    { slug: 'usagi' },
    { slug: 'ca' },
  ];

  async function loadGame(game) {
    const link = game.href ?? game.slug + '/';
    try {
      const res = await fetch(link + 'index.html');
      if (!res.ok) throw new Error(res.status);
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      return {
        link,
        title: doc.querySelector('title')?.textContent?.trim() || game.slug,
        desc: doc.querySelector('meta[name="description"]')?.content?.trim() || '',
      };
    } catch {
      return { link, title: game.slug, desc: '' };
    }
  }

  function renderCard({ link, title, desc }) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = link;

    const t = document.createElement('div');
    t.className = 'card-title';
    t.textContent = title;

    const d = document.createElement('div');
    d.className = 'card-desc';
    d.textContent = desc;

    a.append(t, d);
    return a;
  }

  (async () => {
    const grid = document.getElementById('grid');
    const cards = await Promise.all(GAMES.map(loadGame));
    cards.forEach(c => grid.appendChild(renderCard(c)));
  })();
</script>
</body>
</html>
